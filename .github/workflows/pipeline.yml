
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism-package-prediction/requirements.txt

      - name: Register Dataset
        run: python tourism-package-prediction/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism-package-prediction/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism-package-prediction/requirements.txt

      - name: Run Data Preparation
        run: python tourism-package-prediction/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism-package-prediction/requirements.txt
          pip install mlflow

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          sleep 10

      - name: Model Building
        run: python tourism-package-prediction/model_building/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A tourism-package-prediction/deployment/
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
